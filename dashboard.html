<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRA Portfolio Metrics Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
  <style>
    /* ── Enhanced Dashboard Styles ── */
    body {
      background: linear-gradient(135deg, #07090f 0%, #0a0f1a 100%);
    }

    .metrics-container {
      max-width: 1800px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .metrics-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 24px;
    }

    .metrics-title-group h1 {
      font-size: 2.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #1e8fe0, #00c8a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
      letter-spacing: -.02em;
    }

    .metrics-title-group p {
      font-size: 1rem;
      color: var(--text-secondary);
      margin: 8px 0 0 0;
    }

    .metrics-nav-btn {
      padding: 12px 24px;
      font-size: 13px;
      font-weight: 700;
      background: linear-gradient(135deg, #1e8fe0, #00c8a0);
      border: none;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all .2s;
      box-shadow: 0 4px 16px rgba(30,143,224,.25);
    }

    .metrics-nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(30,143,224,.35);
    }

    /* Overview Section */
    .metrics-overview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .metric-card {
      background: linear-gradient(135deg, var(--bg-surface) 0%, #0f1828 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
      transition: all .3s cubic-bezier(.23, 1, .320, 1);
      position: relative;
      overflow: hidden;
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #1e8fe0, #00c8a0);
      opacity: 0;
      transition: opacity .3s;
    }

    .metric-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-normal);
      box-shadow: 0 12px 48px rgba(0,0,0,.4);
    }

    .metric-card:hover::before {
      opacity: 1;
    }

    .metric-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .12em;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .metric-value {
      font-size: 2.2rem;
      font-weight: 900;
      font-family: var(--font-mono);
      color: var(--accent-blue);
      margin-bottom: 8px;
      letter-spacing: -.01em;
    }

    .metric-value.gain { color: #28d890; }
    .metric-value.danger { color: #f05060; }

    .metric-sub {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Charts Section */
    .charts-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    .chart-card {
      background: linear-gradient(135deg, var(--bg-surface) 0%, #0f1828 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
    }

    .chart-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 20px;
      letter-spacing: -.01em;
    }

    .chart-container {
      position: relative;
      height: 300px;
    }

    /* Portfolio Grid */
    .portfolio-grid-header {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 24px;
      letter-spacing: -.01em;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    .portfolio-summary-card {
      background: linear-gradient(135deg, var(--bg-surface) 0%, #0f1828 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
      transition: all .3s;
      position: relative;
      overflow: hidden;
    }

    .portfolio-summary-card::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(30,143,224,.1) 0%, transparent 70%);
      opacity: 0;
      transition: opacity .3s;
    }

    .portfolio-summary-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-normal);
      box-shadow: 0 12px 48px rgba(0,0,0,.4);
    }

    .portfolio-summary-card:hover::after {
      opacity: 1;
    }

    .portfolio-summary-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border-subtle);
    }

    .portfolio-summary-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -.01em;
    }

    .portfolio-summary-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .portfolio-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #1e8fe0, #00c8a0);
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .portfolio-metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .portfolio-metric-item {
      background: var(--bg-table-head);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .portfolio-metric-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .portfolio-metric-val {
      font-size: 14.5px;
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--accent-blue);
    }

    .holdings-mini-list {
      background: var(--bg-table-head);
      border-radius: 8px;
      padding: 14px;
      max-height: 140px;
      overflow-y: auto;
      border: 1px solid var(--border-subtle);
    }

    .holdings-mini-title {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 700;
    }

    .holding-mini {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      padding: 5px 0;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-subtle);
    }

    .holding-mini:last-child {
      border-bottom: none;
    }

    .holding-ticker {
      font-weight: 700;
      color: var(--accent-blue);
      font-family: var(--font-mono);
      letter-spacing: .02em;
    }

    .dashboard-footer-link {
      text-align: center;
      padding: 32px 24px;
      border-top: 2px solid var(--border-subtle);
      margin-top: 40px;
    }

    .dashboard-footer-link a {
      display: inline-block;
      padding: 16px 40px;
      background: linear-gradient(135deg, #1e8fe0, #00c8a0);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14px;
      transition: all .2s;
      box-shadow: 0 6px 20px rgba(30,143,224,.3);
      letter-spacing: -.01em;
    }

    .dashboard-footer-link a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(30,143,224,.4);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: .5;
    }

    .empty-state p {
      font-size: 14px;
      margin-bottom: 16px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .metrics-title-group h1 {
        font-size: 2rem;
      }

      .metrics-overview {
        grid-template-columns: 1fr;
      }

      .charts-section {
        grid-template-columns: 1fr;
      }

      .portfolio-grid {
        grid-template-columns: 1fr;
      }

      .metric-value {
        font-size: 1.8rem;
      }

      .chart-container {
        height: 250px;
      }
    }
  </style>
</head>
<body>
  <!-- Site Header -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="brand-mark">◈</span>
        <div class="brand-text">
          <h1 class="brand-title">IRA Portfolio Metrics</h1>
          <p class="brand-sub">Advanced Analytics &amp; Insights</p>
        </div>
      </div>
      <div class="header-right">
        <span class="header-date" id="current-date"></span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="metrics-container">
    <div class="metrics-header">
      <div class="metrics-title-group">
        <h1>Your Portfolio Overview</h1>
        <p>Real-time metrics, allocation analysis, and returns forecast</p>
      </div>
      <a href="index.html" class="metrics-nav-btn">→ Detailed Rebalance Tool</a>
    </div>

    <!-- Overview Metrics -->
    <div class="metrics-overview" id="overview-metrics">
      <!-- Populated by JavaScript -->
    </div>

    <!-- Charts Section -->
    <div class="charts-section">
      <div class="chart-card">
        <div class="chart-title">Portfolio Allocation</div>
        <div class="chart-container">
          <canvas id="allocationChart"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-title">Expected Annual Returns</div>
        <div class="chart-container">
          <canvas id="returnsChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Portfolio Breakdown -->
    <div id="portfolio-summaries-section">
      <div class="portfolio-grid-header">Portfolio Breakdown</div>
      <div class="portfolio-grid" id="portfolio-cards">
        <!-- Populated by JavaScript -->
      </div>
    </div>

    <div class="dashboard-footer-link">
      <a href="index.html">Open Full Rebalancing Dashboard →</a>
    </div>
  </main>

  <script>
    // Expected annual return assumptions (synced with index dashboard logic)
    const EXPECTED_RETURNS = {
      VTI: 0.07,   // 7% US stocks
      QQQ: 0.08,   // 8% Nasdaq
      VXUS: 0.06,  // 6% Intl
      BND: 0.03,   // 3% Bonds
      GLD: 0.025,  // 2.5% Gold
      SCHD: 0.065, // 6.5% Dividends
      VYM: 0.06,   // 6% High Div
      VGIT: 0.03,  // 3% Bonds
      VTIP: 0.03,  // 3% TIPS
      VNQ: 0.06,   // 6% REIT
      SGOV: 0.05,  // 5% baseline assumption
      VGSH: 0.05,  // 5% baseline assumption
      JEPI: 0.065, // 6.5% income equity
      FZROX: 0.07, // 7% total market index
      XLV: 0.06,   // 6% healthcare
      SMH: 0.10,   // 10% semiconductors
      VBT: 0.08,   // 8% high-growth sleeve
      GLDM: 0.05,  // 5% baseline assumption
      USHV: 0.065, // 6.5% value/dividend sleeve
      BNDW: 0.03,  // 3% global bonds
    };

    let allocationChartInstance = null;
    let returnsChartInstance = null;
    const LS_STATE_KEY = 'ira-dashboard-state';

    function getDefaultPortfolios() {
      return [
        {
          id: 'trad-ira',
          name: 'Traditional IRA',
          subtitle: 'Aggressive Growth — Tax-Deferred',
          holdings: [
            { ticker: 'VTI', shares: 150, price: 238.42, targetPct: 45, mktPrice: 0 },
            { ticker: 'QQQ', shares: 45, price: 495.80, targetPct: 35, mktPrice: 0 },
            { ticker: 'VXUS', shares: 100, price: 62.15, targetPct: 10, mktPrice: 0 },
            { ticker: 'BND', shares: 50, price: 74.22, targetPct: 5, mktPrice: 0 },
            { ticker: 'GLD', shares: 25, price: 189.50, targetPct: 5, mktPrice: 0 },
          ],
        },
        {
          id: 'roth-ira',
          name: 'Roth IRA',
          subtitle: 'Income & Stability — Tax-Free Growth',
          holdings: [
            { ticker: 'SCHD', shares: 200, price: 79.88, targetPct: 20, mktPrice: 0 },
            { ticker: 'VYM', shares: 120, price: 124.33, targetPct: 29, mktPrice: 0 },
            { ticker: 'VGIT', shares: 200, price: 58.90, targetPct: 19, mktPrice: 0 },
            { ticker: 'VTIP', shares: 100, price: 106.75, targetPct: 21, mktPrice: 0 },
            { ticker: 'VNQ', shares: 80, price: 88.50, targetPct: 11, mktPrice: 0 },
          ],
        },
      ];
    }

    function formatCurrency(value) {
      return '$' + Number(value).toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
    }

    function formatPercent(value) {
      return `${Number(value).toFixed(2)}%`;
    }

    function calculatePortfolioMetrics(portfolio) {
      let totalValue = 0;
      let expectedReturnAmount = 0;
      let driftAlerts = 0;

      portfolio.holdings.forEach(h => {
        const shares = h.shares || 0;
        const price = h.mktPrice > 0 ? h.mktPrice : h.price || 0;
        const currentValue = shares * price;
        totalValue += currentValue;

        const yieldValue = h.yield || 0;
        const expectedReturnPct = yieldValue > 0 ? (yieldValue / 100) : 0;
        expectedReturnAmount += currentValue * expectedReturnPct;

        if (totalValue > 0) {
          const currentPct = (currentValue / totalValue) * 100;
          const driftPct = currentPct - h.targetPct;
          if (Math.abs(driftPct) > 3) driftAlerts++;
        }
      });

      const expectedReturnPct = totalValue > 0 ? (expectedReturnAmount / totalValue) : 0;

      return {
        totalValue,
        expectedReturnAmount,
        expectedReturnPct,
        driftAlerts,
        holdingCount: portfolio.holdings.length,
      };
    }

    function renderCharts(portfolios) {
      const colors = ['#1e8fe0', '#00c8a0', '#f5a623', '#48aaee', '#28d890'];
      
      // Allocation Chart (Pie)
      const portNames = portfolios.map(p => p.name);
      const portValues = portfolios.map((p, idx) => {
        const m = calculatePortfolioMetrics(p);
        return m.totalValue;
      });

      const ctxAllocation = document.getElementById('allocationChart')?.getContext('2d');
      if (ctxAllocation && allocationChartInstance) {
        allocationChartInstance.destroy();
      }
      if (ctxAllocation) {
        allocationChartInstance = new Chart(ctxAllocation, {
          type: 'doughnut',
          data: {
            labels: portNames,
            datasets: [{
              data: portValues,
              backgroundColor: colors,
              borderColor: '#0d1320',
              borderWidth: 2,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  color: '#c8d8f0',
                  font: { size: 12, weight: '600' },
                  padding: 12,
                },
              },
            },
          },
        });
      }

      // Returns Chart (Bar)
      const portReturns = portfolios.map((p, idx) => {
        const m = calculatePortfolioMetrics(p);
        return m.expectedReturnAmount;
      });

      const ctxReturns = document.getElementById('returnsChart')?.getContext('2d');
      if (ctxReturns && returnsChartInstance) {
        returnsChartInstance.destroy();
      }
      if (ctxReturns) {
        returnsChartInstance = new Chart(ctxReturns, {
          type: 'bar',
          data: {
            labels: portNames,
            datasets: [{
              label: 'Annual Return ($)',
              data: portReturns,
              backgroundColor: colors,
              borderRadius: 6,
              borderSkipped: false,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                labels: { color: '#c8d8f0', font: { size: 12 } },
              },
            },
            scales: {
              y: {
                ticks: { color: '#6a8bb0', font: { size: 11 } },
                grid: { color: 'rgba(30,48,80,.2)' },
              },
              x: {
                ticks: { color: '#6a8bb0', font: { size: 11 } },
                grid: { display: false },
              },
            },
          },
        });
      }
    }

    function renderDashboard(portfolios) {
      let grandTotal = 0;
      let grandExpectedReturn = 0;
      let totalAlerts = 0;
      const portMetrics = [];

      portfolios.forEach(p => {
        const m = calculatePortfolioMetrics(p);
        portMetrics.push(m);
        grandTotal += m.totalValue;
        grandExpectedReturn += m.expectedReturnAmount;
        totalAlerts += m.driftAlerts;
      });

      const primaryIndex = portMetrics.reduce(
        (bestIdx, current, idx, arr) => (current.totalValue > arr[bestIdx].totalValue ? idx : bestIdx),
        0
      );
      const primaryPortfolio = portfolios[primaryIndex];
      const primaryMetrics = portMetrics[primaryIndex];

      // Overview cards
      const overviewEl = document.getElementById('overview-metrics');
      overviewEl.innerHTML = `
        <div class="metric-card">
          <div class="metric-label">Total Assets Under Management</div>
          <div class="metric-value gain">${formatCurrency(grandTotal)}</div>
          <div class="metric-sub">Across ${portfolios.length} portfolios</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Projected Annual Return</div>
          <div class="metric-value">${formatCurrency(primaryMetrics.expectedReturnAmount)}</div>
          <div class="metric-sub">${formatPercent(primaryMetrics.expectedReturnPct * 100)} annualized · ${primaryPortfolio.name}</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Total Holdings</div>
          <div class="metric-value">${portfolios.reduce((s, p) => s + p.holdings.length, 0)}</div>
          <div class="metric-sub">Securities across accounts</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Rebalancing Alerts</div>
          <div class="metric-value ${totalAlerts > 0 ? 'danger' : ''}">${totalAlerts}</div>
          <div class="metric-sub">${totalAlerts > 0 ? 'Action needed' : 'Well balanced'}</div>
        </div>
      `;

      // Portfolio cards
      const portfolioCardsEl = document.getElementById('portfolio-cards');
      portfolioCardsEl.innerHTML = portfolios.map((p, idx) => {
        const m = portMetrics[idx];
        const expReturnPct = m.totalValue > 0 ? (m.expectedReturnPct * 100) : 0;

        return `
          <div class="portfolio-summary-card">
            <div class="portfolio-summary-header">
              <div>
                <div class="portfolio-summary-title">${p.name}</div>
                <div class="portfolio-summary-sub">${p.subtitle}</div>
              </div>
              <div class="portfolio-badge">${idx + 1}</div>
            </div>

            <div class="portfolio-metrics-grid">
              <div class="portfolio-metric-item">
                <div class="portfolio-metric-label">Total Value</div>
                <div class="portfolio-metric-val">${formatCurrency(m.totalValue)}</div>
              </div>
              <div class="portfolio-metric-item">
                <div class="portfolio-metric-label">Expected Return</div>
                <div class="portfolio-metric-val">${formatCurrency(m.expectedReturnAmount)}</div>
              </div>
              <div class="portfolio-metric-item">
                <div class="portfolio-metric-label">Return %</div>
                <div class="portfolio-metric-val" style="color:var(--accent-blue);">${formatPercent(expReturnPct)}</div>
              </div>
              <div class="portfolio-metric-item">
                <div class="portfolio-metric-label">Alerts</div>
                <div class="portfolio-metric-val" style="color:${m.driftAlerts > 0 ? '#f05060' : '#28d890'};">${m.driftAlerts}</div>
              </div>
            </div>

            <div class="holdings-mini-list">
              <div class="holdings-mini-title">Top Holdings (${m.holdingCount})</div>
              ${p.holdings.map(h => {
                const price = h.mktPrice > 0 ? h.mktPrice : h.price || 0;
                const val = (h.shares || 0) * price;
                return `
                  <div class="holding-mini">
                    <span class="holding-ticker">${h.ticker}</span>
                    <span>${formatCurrency(val)}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');

      // Render charts
      renderCharts(portfolios);
    }

    function setCurrentDate() {
      const el = document.getElementById('current-date');
      if (el) {
        el.textContent = new Date().toLocaleDateString('en-US', {
          weekday: 'short', month: 'short', day: 'numeric', year: 'numeric',
        });
      }
    }

    function normalizePortfolioPayload(payload) {
      if (!payload || !Array.isArray(payload.portfolios)) return null;
      return payload.portfolios.length > 0 ? payload.portfolios : null;
    }

    function pickLargestPortfolioSet(...sets) {
      const validSets = sets.filter(s => Array.isArray(s) && s.length > 0);
      if (validSets.length === 0) return null;
      return validSets.reduce((largest, current) => (current.length > largest.length ? current : largest));
    }

    function loadPortfoliosFromLocalStorage() {
      try {
        const raw = localStorage.getItem(LS_STATE_KEY);
        if (!raw) return null;
        const state = JSON.parse(raw);
        return normalizePortfolioPayload(state);
      } catch (e) {
        console.warn('Unable to read local portfolio state:', e);
        return null;
      }
    }

    async function loadPortfolioData() {
      // 1) Preferred source when running with local server.
      let apiPortfolios = null;
      try {
        const response = await fetch('/api/data');
        if (response.ok) {
          const data = await response.json();
          apiPortfolios = normalizePortfolioPayload(data);
        }
      } catch (_) {}

      // 2) Persisted browser state from the main rebalancing dashboard.
      const localPortfolios = loadPortfoliosFromLocalStorage();

      // 3) Static dataset fallback when served as a static site.
      let filePortfolios = null;
      try {
        const response = await fetch('data/portfolio.json');
        if (response.ok) {
          const data = await response.json();
          filePortfolios = normalizePortfolioPayload(data);
        }
      } catch (_) {}

      const bestPortfolios = pickLargestPortfolioSet(apiPortfolios, filePortfolios, localPortfolios);
      if (bestPortfolios) return bestPortfolios;

      // 4) Last-resort demo data.
      console.warn('Using demo portfolios fallback (2 portfolios).');
      return getDefaultPortfolios();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      setCurrentDate();
      const portfolios = await loadPortfolioData();
      renderDashboard(portfolios);
    });
  </script>
</body>
</html>
